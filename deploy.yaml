version: "3.8"
services:
  ntopg:
    image: ntop/ntopng:latest
    volumes:
      - /volume1/docker/ntop/data:/etc/ntopng.license:ro
    ports:
      - "3001:3001"
    environment:
      - TZ="America/Los_Angeles"
    network_mode: "host"
    command: ["-i", "eth0","-i", "eth3","-i", "tun0","-i", "lo", "-i", "bond0"]
    restart: unless-stopped
