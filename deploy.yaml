version: '3.8'

services:
  ntopng-redis:
    image: redis:alpine
    container_name: ntopng-redis
    restart: unless-stopped
    command: redis-server --allow-empty-password yes

  ntopng:
    image: ntop/ntopng:stable
    container_name: ntopng
    restart: unless-stopped
    depends_on:
      - ntopng-redis
    ports:
      # Format: "HOST_PORT:CONTAINER_PORT"
      # Change 3000 below if you want to use a different port on your host machine
      - "7275:7275/tcp"
      - "2055:2055/udp"  # For collecting NetFlow/sFlow data
    command: ["ntopng", "-i", "eth0", "-r", "ntopng-redis:6379", "-w", "7275"]
