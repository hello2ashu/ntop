services: 
 ntopng:
    hostname: ntopng
    image: ntop/ntopng:latest
    container_name: ntopng
    healthcheck:
       test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
       interval: 10s
       timeout: 5s
       retries: 3
       start_period: 90s
    mem_limit: 4g
    cpu_shares: 768
    network_mode: host
    command: --community
    security_opt:
      - no-new-privileges:true
    volumes:
      - /volume1/docker/ntopng:/var/lib/ntopng:rw
    restart: on-failure:5
